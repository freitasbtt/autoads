version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: meta-ads-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaads"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meta-ads-network

  # Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meta-ads-app
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      META_TOKEN_ENC_KEY: ${META_TOKEN_ENC_KEY:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_SERVICE_ACCOUNT_FILE: /app/.local/secrets/gcs.json
      PUBLIC_STORAGE_UPLOAD_RATE_LIMIT: ${PUBLIC_STORAGE_UPLOAD_RATE_LIMIT:-100}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
    volumes:
      - ./${GCS_SERVICE_ACCOUNT_FILE}:/app/.local/secrets/gcs.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - meta-ads-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: meta-ads-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: grafana.orygo.com.br
      GF_SERVER_ROOT_URL: https://grafana.orygo.com.br
      GF_SERVER_ENFORCE_DOMAIN: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - meta-ads-network
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:

networks:
  meta-ads-network:
    driver: bridge
