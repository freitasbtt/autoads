version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: meta-ads-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metaads"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - meta-ads-network

  # Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meta-ads-app
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      META_TOKEN_ENC_KEY: ${META_TOKEN_ENC_KEY:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
      GCS_SERVICE_ACCOUNT_FILE: /app/.local/secrets/gcs.json
      PUBLIC_STORAGE_UPLOAD_RATE_LIMIT: ${PUBLIC_STORAGE_UPLOAD_RATE_LIMIT:-100}
      FORCE_HTTPS: ${FORCE_HTTPS:-false}
      LOG_IP_HASH_SECRET: ${LOG_IP_HASH_SECRET:-}
    volumes:
      - ./${GCS_SERVICE_ACCOUNT_FILE}:/app/.local/secrets/gcs.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - meta-ads-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: meta-ads-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: grafana.orygo.com.br
      GF_SERVER_ROOT_URL: https://grafana.orygo.com.br
      GF_SERVER_ENFORCE_DOMAIN: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - meta-ads-network
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: meta-ads-loki
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    networks:
      - meta-ads-network
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    container_name: meta-ads-alloy
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      - meta-ads-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: meta-ads-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./.local/secrets/prometheus-internal-api-secret:/run/secrets/prometheus-internal-api-secret:ro
      - prometheus_data:/prometheus
    networks:
      - meta-ads-network
    restart: unless-stopped

volumes:
  postgres_data:
  grafana_data:
  loki_data:
  alloy_data:
  prometheus_data:

networks:
  meta-ads-network:
    driver: bridge
